name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # ubuntu-24.04 ships PostgreSQL 16 (service stopped); test/run_local.sh starts it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary aiohttp requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: SQL, respondent and deck suites on the local stack
        run: bash test/run_local.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-and-log
          path: |
            test/shots/
            test/shots-deck/
            test/fake.log
          if-no-files-found: ignore
